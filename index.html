<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Error Card 7: Meta tag viewport para diseño responsivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Gestor de Tareas</h1>
        
        <div class="input-group">
            <input type="text" id="nueva-tarea" placeholder="Escribe tu tarea...">
            <button id="agregar-tarea">Agregar Tarea</button>
        </div>
        
        <!-- Error Card 5: Espacio para mostrar mensajes de error al usuario -->
        <p id="mensaje-error" class="error-message"></p>
        
        <ul id="lista-tareas"></ul>
    </div>

    <!-- Error Card 1: Script enlazado con defer antes de cerrar body -->
    <script src="app.js" defer></script>
</body>
</html>
